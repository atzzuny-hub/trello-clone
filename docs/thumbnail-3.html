<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Trello Clone Thumbnail 3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Apple SD Gothic Neo", "Pretendard", -apple-system, sans-serif;
    background: linear-gradient(135deg, #eff6ff 0%, #ffffff 45%, #f3e8ff 100%);
    color: #0f172a;
    position: relative;
  }
  .glow {
    position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55;
  }
  .glow.a { width: 420px; height: 420px; background: #bfdbfe; top: -140px; left: -120px; }
  .glow.b { width: 380px; height: 380px; background: #e9d5ff; bottom: -160px; right: -80px; }

  .left { position: absolute; left: 80px; top: 92px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 56px; height: 56px; }
  .brand span { font-size: 30px; font-weight: 800; color: #1e293b; letter-spacing: -0.5px; }
  .ep {
    display: inline-block; margin-top: 44px; padding: 8px 18px; border-radius: 999px;
    background: #2563eb; color: #fff; font-size: 22px; font-weight: 700;
  }
  h1 { margin-top: 20px; font-size: 64px; line-height: 1.15; font-weight: 800; letter-spacing: -2px; }
  h1 em { font-style: normal; color: #2563eb; }
  .sub { margin-top: 18px; font-size: 26px; color: #475569; font-weight: 500; }
  .stack { position: absolute; left: 80px; bottom: 70px; display: flex; gap: 10px; }
  .stack span {
    padding: 8px 16px; border-radius: 10px; background: rgba(255,255,255,.85);
    border: 1px solid #e2e8f0; font-size: 19px; font-weight: 600; color: #334155;
  }

  .board {
    position: absolute; right: 70px; top: 110px; display: flex; gap: 16px;
    transform: rotate(-4deg);
  }
  .col {
    width: 150px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,.9);
    box-shadow: 0 18px 40px -16px rgba(30, 64, 175, .35); border: 1px solid #e2e8f0;
  }
  .col h3 { font-size: 15px; font-weight: 700; color: #64748b; margin-bottom: 12px; }
  .card {
    height: 44px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0;
    margin-bottom: 10px; position: relative;
  }
  .card::before {
    content: ""; position: absolute; left: 12px; top: 12px; width: 60%; height: 7px;
    border-radius: 4px; background: #cbd5e1;
  }
  .card::after {
    content: ""; position: absolute; left: 12px; top: 26px; width: 38%; height: 7px;
    border-radius: 4px; background: #e2e8f0;
  }
  .card.blue { border-left: 5px solid #3b82f6; }
  .card.purple { border-left: 5px solid #a855f7; }
  .card.green { border-left: 5px solid #22c55e; }
  .card.drag {
    background: #fff; border-color: #93c5fd; transform: rotate(8deg) translate(26px, -6px);
    box-shadow: 0 16px 30px -10px rgba(37, 99, 235, .45);
  }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <div class="left">
    <div class="brand">
      <!-- lucide SquareKanban -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/>
      </svg>
      <span>Trello Clone</span>
    </div>
    <div class="ep">클론 코딩 #3</div>
    <h1><em>Supabase</em><br>테이블 설계</h1>
    <p class="sub">boards · columns · tasks 세 테이블 만들기</p>
  </div>

  <div class="board">
    <div class="col">
      <h3>To Do</h3>
      <div class="card blue"></div>
      <div class="card"></div>
      <div class="card purple"></div>
    </div>
    <div class="col" style="margin-top: 40px;">
      <h3>In Progress</h3>
      <div class="card drag blue"></div>
      <div class="card green"></div>
    </div>
    <div class="col" style="margin-top: 14px;">
      <h3>Done</h3>
      <div class="card green"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card purple"></div>
    </div>
  </div>

  <div class="stack">
    <span>Supabase</span><span>Postgres</span><span>Clerk</span><span>Next.js 15</span>
  </div>
</body>
</html>
